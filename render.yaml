# Render Blueprint for this static site: https://render.com/docs/blueprint-spec
#
# Import this repo on Render via "New +" -> "Blueprint" and it reads this file
# automatically, creating the static site with the fields below already filled in.
# (Setting the same three fields by hand under "New +" -> "Static Site" works too, if
# a Blueprint import isn't preferred -- this file just saves that manual step.)
#
# No routes/rewrites are configured on purpose: this is a fully static multi-page
# Astro build (not a single-page app), so every route is a real file in dist/ and
# needs no rewrite. Render serves dist/404.html for unmatched paths by default, the
# same convention the sibling Netlify and Cloudflare Pages blogs rely on.
services:
  - type: web
    runtime: static
    name: replit-blog
    buildCommand: npm run build
    staticPublishPath: dist
